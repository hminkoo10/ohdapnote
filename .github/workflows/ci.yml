name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # 단위 테스트는 수식 인식 모델을 쓰지 않으므로 onnxruntime-node 설치 스크립트(리눅스에서 CUDA 패키지를 받음)는 건너뜀
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test

  # 설치 파일이 잘 만들어지는지 확인하고, 시험용 설치 파일을 Artifacts 로 올립니다(릴리스는 하지 않음).
  # main 은 Release 워크플로가 빌드·배포하므로 여기서는 건너뜀
  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 수식 인식 모델(약 120MB)은 저장소에 없어서 빌드 전에 받아 설치 파일에 넣음 (받은 파일은 캐시에 둠)
      - uses: actions/cache@v4
        with:
          path: build/models
          key: mathocr-model-${{ hashFiles('src/main/mathocr.js') }}
          restore-keys: mathocr-model-
      - run: node scripts/fetch-model.mjs
      - run: npx electron-builder --win --x64 --publish never
      # 배포 때 쓰는 것과 같은 파일 세 개(설치 파일, blockmap, 자동 업데이트용 latest.yml)가 다 만들어졌는지
      - name: 업데이트 파일 확인
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          ls -l dist
          test -f "dist/OhdapNote-Setup-$v.exe"
          test -f "dist/OhdapNote-Setup-$v.exe.blockmap"
          grep -q "OhdapNote-Setup-$v.exe" dist/latest.yml
          test -f dist/win-unpacked/resources/models/pix2text-mfr-1.5/encoder_model.onnx || { echo "::error::설치 파일에 수식 인식 모델이 없습니다"; exit 1; }
          cat dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: OhdapNote-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
