name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # 설치 파일이 잘 만들어지는지 확인하고, 시험용 설치 파일을 Artifacts 로 올립니다(릴리스는 하지 않음).
  # main 은 Release 워크플로가 빌드·배포하므로 여기서는 건너뜀
  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      # 배포 때 쓰는 것과 같은 파일 세 개(설치 파일, blockmap, 자동 업데이트용 latest.yml)가 다 만들어졌는지
      - name: 업데이트 파일 확인
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          ls -l dist
          test -f "dist/OhdapNote-Setup-$v.exe"
          test -f "dist/OhdapNote-Setup-$v.exe.blockmap"
          grep -q "OhdapNote-Setup-$v.exe" dist/latest.yml
          cat dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: OhdapNote-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
