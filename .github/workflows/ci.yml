name: CI

# main 과 PR 에서만 (같은 커밋을 브랜치 push 와 PR 로 두 번 돌리지 않게).
# 통합 클라우드용 묶음(zip) 빌드는 main 에서 Release (Windows) 워크플로가 함.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # 단위 테스트는 수식 인식 모델을 쓰지 않으므로 onnxruntime-node 설치 스크립트(리눅스에서 CUDA 패키지를 받음)는 건너뜀
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
