# 새 버전 배포 (윈도우 설치 파일 + 자동 업데이트)
#
# 배포가 시작되는 경우
#  1) main 에 푸시됐는데 package.json 버전의 태그(v1.2.3)가 아직 없을 때 → 자동 배포
#     (버전을 올리고 RELEASE_NOTES.md 에 바뀐 점을 적어 main 에 합치면 끝)
#  2) GitHub → Actions → "Release (Windows)" → Run workflow
#     올릴 버전(patch/minor/major)과 업데이트 내용을 넣으면 버전 올리기·커밋·태그·배포까지
#  3) 태그(v1.2.3)를 직접 푸시
#
# 설치된 프로그램은 Releases 의 최신 버전을 보고 자동으로 업데이트합니다.
name: Release (Windows)

on:
  push:
    branches: [main, claude/zealous-hamilton-bkobax] # 두 번째는 첫 배포(v0.1.0)용 임시 — 바로 다음 커밋에서 지움
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: '올릴 버전 (patch 0.1.0→0.1.1 / minor 0.1.0→0.2.0 / major 0.1.0→1.0.0 / none 지금 버전 그대로)'
        type: choice
        options: [patch, minor, major, none]
        default: patch
      notes:
        description: '이번 업데이트 내용 (앱의 업데이트 알림에 표시됩니다)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 브랜치 푸시일 때: 이 버전이 이미 배포됐는지 확인
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.c.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            v="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
              echo "$v 은(는) 이미 배포됨 → 건너뜀"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "$v 새 버전 → 배포"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: git 사용자 설정
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 버전 올리기 (Actions 화면에서 실행한 경우)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          v="$(node -p "require('./package.json').version")"
          git commit -am "v$v 배포"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 태그 만들기 (태그 푸시가 아닌 경우)
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "::error::$v 태그가 이미 있습니다. package.json 버전을 올려 주세요."
            exit 1
          fi
          git tag "$v"
          git push origin "refs/tags/$v"

      - name: 태그와 package.json 버전 확인 (태그를 푸시한 경우)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($v)이 다릅니다. package.json 의 version 을 먼저 올려 주세요."
            exit 1
          fi

      - name: 업데이트 내용 준비 (입력 → 태그 메시지 → RELEASE_NOTES.md → 기본 문구)
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$NOTES" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
            NOTES="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          fi
          if [ -z "$NOTES" ] && [ -f RELEASE_NOTES.md ]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          fi
          export NOTES
          node -e "const v=require('./package.json').version; const n=(process.env.NOTES||'').replace(/-----BEGIN PGP SIGNATURE-----[\\s\\S]*$/, '').trim(); require('fs').writeFileSync('release-notes.md', n || ('오답노트 ' + v + ' 업데이트'))"
          cat release-notes.md

      - name: 설치 파일 빌드 + GitHub Release 업로드
        shell: bash
        run: npx electron-builder --win --x64 --publish always -c.releaseInfo.releaseNotesFile=release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
