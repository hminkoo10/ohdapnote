<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' app:; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self' app:">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font: 13.333px/1.7 'Malgun Gothic', '맑은 고딕', sans-serif; color: #111; }
      main { padding: 4px 2px; overflow-wrap: anywhere; }
      p { margin: 0 0 7px; white-space: pre-wrap; orphans: 2; widows: 2; }
      .math { text-align: center; margin: 10px 0; break-inside: avoid; }
      math { font-size: 1em; }
      figure { margin: 10px 0; break-inside: avoid; }
      img { display: block; max-width: 100%; max-height: 560px; object-fit: contain; }
    </style>
  </head>
  <body><main></main><script type="module" src="js/answer-print.js"></script></body>
</html>
