<!doctype html>
<html><head><meta charset="utf-8"><title>harness</title></head>
<body>
<script type="module">
  import { openDocSource } from '../../src/renderer/js/docsource.js';
  import { analyzeDocument, parsePageRange } from '../../src/renderer/js/analyze.js';
  import { matchItems } from '../../src/renderer/js/match.js';
  const status = fetch('/__pnd/status').then(r => r.ok ? r.json() : null).catch(() => null);
  async function numberModel() {
    if (!(await status)?.installed) return undefined;
    return {
      onResult(stats) { this.stats = stats; },
      async detect(image) {
        const res = await fetch(`/__pnd/detect?width=${image.width}&height=${image.height}`, { method: 'POST', body: image.data });
        if (!res.ok) throw new Error('Number detection failed');
        return res.json();
      },
    };
  }
  window.harness = {
    numberModel,
    async analyze(fileUrl, opts = {}) {
      const files = Array.isArray(fileUrl) ? fileUrl.map((u) => ({ name: u, kind: /\.pdf$/i.test(u) ? 'pdf' : 'image' })) : [{ name: fileUrl, kind: opts.kind || 'pdf' }];
      const src = await openDocSource(files, (n) => n);
      const t0 = performance.now();
      const model = opts.numberModel === false ? undefined : await numberModel();
      const res = await analyzeDocument(src, { pages: parsePageRange(opts.range || '', src.numPages), role: opts.role || 'problem', flow: opts.flow || 'column', ocrLang: opts.ocrLang || 'kor+eng', numberModel: model });
      const ms = performance.now() - t0;
      await src.destroy();
      return { ms, numPages: src.numPages, items: res.items.map((it) => ({ id: it.id, page: it.page, number: it.number, num: it.num, prefix: it.prefix || '', rects: it.rects, source: it.source, conf: it.conf })), pageInfo: res.pageInfo, signature: res.signature, pageOffset: res.pageOffset, ...(model ? { numberModel: model.stats } : {}) };
    },
    match(problems, answers) { return Object.fromEntries(matchItems(problems, answers)); },
  };
  window.harnessReady = true;
</script>
</body></html>
